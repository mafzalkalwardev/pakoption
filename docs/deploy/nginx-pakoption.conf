# PakOption — nginx site for an Ubuntu VPS (x86_64 or ARM64).
# Next.js listens on 127.0.0.1:3000 (systemd unit pakoption.service).
# Search-console files live outside the app and must win over the proxy.
#
#   sudo certbot --nginx -d pakoption.induswebagency.com

server {
    listen 80;
    listen [::]:80;
    server_name pakoption.induswebagency.com;

    # Verification files. Put the real files in /var/www/pakoption-verify/.
    # Exact match so Next.js never sees these URLs.
    location = /BingSiteAuth.xml {
        alias /var/www/pakoption-verify/BingSiteAuth.xml;
        default_type application/xml;
    }

    location = /ff82568606a8e2966f050af9a9ada4a1.txt {
        alias /var/www/pakoption-verify/ff82568606a8e2966f050af9a9ada4a1.txt;
        default_type text/plain;
    }

    # Any google*.html verification file dropped in that directory.
    location ~ ^/google[^/]*\.html$ {
        root /var/www/pakoption-verify;
        default_type text/html;
    }

    # Listing photos written by the app (UPLOAD_DIR).
    location /uploads/ {
        alias /var/lib/pakoption/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
