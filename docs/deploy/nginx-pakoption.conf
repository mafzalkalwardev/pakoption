# PakOption — nginx site for an Ubuntu VPS.
# The Next.js server listens on 127.0.0.1:3000 (systemd unit pakoption.service).
# Certbot can add the ssl_certificate lines when you run:
#   sudo certbot --nginx -d pakoption.induswebagency.com

server {
    listen 80;
    listen [::]:80;
    server_name pakoption.induswebagency.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
