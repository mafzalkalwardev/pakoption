name: test

on:
  push:
  pull_request:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pakoption
          POSTGRES_PASSWORD: pakoption
          POSTGRES_DB: pakoption_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakoption -d pakoption_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pakoption:pakoption@localhost:5432/pakoption_test
      DIRECT_URL: postgresql://pakoption:pakoption@localhost:5432/pakoption_test
      AUTH_SECRET: ci-auth-secret
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
